name: Actualisation du dashboard

on:
  schedule:
    # Filet de sécurité : GitHub ne respecte pas ses horaires. Le vrai rythme est donné par Supabase
    # (schema_v15.sql) : toutes les 15 min de 6 h à 23 h et à chaque saisie du jour (workflow_dispatch).
    - cron: "0 5-22 * * *"
    - cron: "0 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dépendances
        run: pip install openpyxl==3.1.5 cryptography==44.0.2

      # Jeton de session Microsoft renouvelé à chaque passage (chiffré)
      - name: Récupérer la session Microsoft
        uses: actions/cache/restore@v4
        with:
          path: .ms_token
          key: ms-token-${{ github.run_id }}
          restore-keys: ms-token-

      - name: Recopier la saisie du jour dans l'Excel Objectifs (espace équipe → SharePoint)
        env:
          DASH_PASSWORD: ${{ secrets.DASH_PASSWORD }}
          MS_REFRESH_TOKEN: ${{ secrets.MS_REFRESH_TOKEN }}
          MS_TOKEN_DIR: .ms_token
          MS_SCOPE: ${{ vars.MS_SCOPE }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python sync_saisie.py || echo "::warning::Recopie de la saisie du jour en échec"

      - name: Télécharger les fichiers SharePoint
        env:
          MS_REFRESH_TOKEN: ${{ secrets.MS_REFRESH_TOKEN }}
          DASH_PASSWORD: ${{ secrets.DASH_PASSWORD }}
          MS_TOKEN_DIR: .ms_token
          MS_SCOPE: ${{ vars.MS_SCOPE }}
          PALOMANO_SUIVI_DIR: ${{ runner.temp }}/sources
        run: python fetch_sharepoint.py

      - name: Synchroniser la facturation écoles & centres (Excel ↔ espace équipe)
        env:
          DASH_PASSWORD: ${{ secrets.DASH_PASSWORD }}
          MS_TOKEN_DIR: .ms_token
          MS_SCOPE: ${{ vars.MS_SCOPE }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python sync_facturation.py || echo "::warning::Synchronisation facturation en échec"

      - name: Importer les réservations Qweekle (anniversaires, centres, écoles)
        env:
          DASH_PASSWORD: ${{ secrets.DASH_PASSWORD }}
          MS_TOKEN_DIR: .ms_token
          MS_SCOPE: ${{ vars.MS_SCOPE }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PALOMANO_SUIVI_DIR: ${{ runner.temp }}/sources
        run: python import_qweekle.py || echo "::warning::Import Qweekle en échec"

      - name: Lire les commandes Qweekle des anniversaires (options, total, acompte, reste à payer)
        env:
          QWEEKLE_EMAIL: ${{ secrets.QWEEKLE_EMAIL }}
          QWEEKLE_PASSWORD: ${{ secrets.QWEEKLE_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python sync_commandes.py || echo "::warning::Commandes Qweekle en échec"


      - name: Conserver la session Microsoft
        if: always() && hashFiles('.ms_token/refresh_token.enc') != ''
        uses: actions/cache/save@v4
        with:
          path: .ms_token
          key: ms-token-${{ github.run_id }}

      - name: Générer le dashboard
        env:
          PALOMANO_SUIVI_DIR: ${{ runner.temp }}/sources
          TZ: Europe/Paris
        run: python build_dashboard.py

      - name: Chiffrer la page
        env:
          DASH_PASSWORD: ${{ secrets.DASH_PASSWORD }}
        run: python encrypt_page.py

      # Espace équipe (app statique ; les données vivent dans Supabase, protégées par ses règles d'accès)
      - name: Ajouter l'espace équipe (racine du site) et la redirection de l'ancienne adresse
        run: |
          cp equipe/index.html equipe/config.js site/ && cp -r equipe/assets site/assets
          mkdir -p site/equipe && cp equipe/ancienne-adresse.html site/equipe/index.html

      - name: Publier les indicateurs pour l'équipe
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python publish_kpis.py || echo "::warning::Indicateurs équipe non publiés"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

      # GitHub désactive les tâches planifiées d'un dépôt sans activité pendant 60 jours :
      # on réactive le workflow à chaque passage pour remettre le compteur à zéro.
      - name: Garder la planification active
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/refresh.yml/enable" || true
